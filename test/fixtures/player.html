<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maple Street S01E03 – Fixture Player</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f2f2f5;
        font:
          14px/1.4 system-ui,
          sans-serif;
        color: #222;
      }
      .player {
        position: relative;
        width: min(960px, 100%);
        aspect-ratio: 16 / 9;
        background: radial-gradient(circle at 30% 35%, #3a4a6b, #101418 70%);
        overflow: hidden;
        border-radius: 8px;
      }
      .player video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      .player:fullscreen {
        border-radius: 0;
        width: 100%;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
        color: #fff;
      }
      .bar input[type='range'] {
        flex: 1;
      }
      .bar button {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border: 0;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .clock {
        position: absolute;
        top: 12px;
        left: 16px;
        color: rgba(255, 255, 255, 0.8);
        font:
          600 28px ui-monospace,
          monospace;
      }
      #log {
        margin-top: 12px;
        height: 140px;
        overflow: auto;
        background: #fff;
        border: 1px solid #ccd;
        padding: 6px 8px;
        font:
          12px ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
      .links a {
        margin-right: 12px;
      }
    </style>
  </head>
  <body>
    <p class="links">
      <a href="player.html">player</a>
      <a href="player.html?media=media/long.wav">long (1 000 cues: media/long.srt)</a>
      <a href="player.html?spa=1">SPA swap</a>
      <a href="iframe.html">in iframe</a>
      <a href="player.html?track=1">with &lt;track&gt;</a>
      <a href="player.html?sniff=1">loads subtitles itself</a>
      <label><input type="checkbox" id="siteKeys" checked /> site Space handler</label>
    </p>

    <div class="player" id="player">
      <div class="clock" id="clock">0:00.0</div>
      <video id="v" preload="auto"></video>
      <div class="bar">
        <button id="play">Play</button>
        <input type="range" id="seek" min="0" max="60" step="0.1" value="0" />
        <span id="time">0:00</span>
        <button id="next" hidden>Next episode</button>
        <button id="fs">Fullscreen</button>
        <button id="fs-video">Video fullscreen</button>
        <button id="next-blob" hidden>Next (blob)</button>
        <button id="next-url" hidden>Next (URL only)</button>
      </div>
    </div>
    <div id="log"></div>

    <script>
      const params = new URLSearchParams(location.search);
      const player = document.getElementById('player');
      const log = (msg) => {
        const el = document.getElementById('log');
        el.textContent += `${new Date().toISOString().slice(11, 23)}  ${msg}\n`;
        el.scrollTop = el.scrollHeight;
      };
      window.siteToggles = 0;
      const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;

      let video;
      function bind(v) {
        video = v;
        // blob mode sets its own source once (a site would not set a URL first).
        if (!params.get('blob')) v.src = params.get('media') ?? 'media/tone.wav';
        if (params.get('track')) {
          const tr = document.createElement('track');
          tr.kind = 'subtitles';
          tr.label = 'English (fixture)';
          tr.srclang = 'en';
          tr.src = 'sample.vtt';
          v.appendChild(tr);
        }
        v.addEventListener('loadedmetadata', () => {
          document.getElementById('seek').max = String(v.duration);
        });
        v.addEventListener('timeupdate', () => {
          document.getElementById('seek').value = String(v.currentTime);
          document.getElementById('time').textContent = fmt(v.currentTime);
        });
        v.addEventListener('play', () => (document.getElementById('play').textContent = 'Pause'));
        v.addEventListener('pause', () => (document.getElementById('play').textContent = 'Play'));
        // Typical player behaviour: clicking the picture toggles playback.
        v.addEventListener('click', () => {
          window.siteToggles++;
          log('site: click on video → toggle');
          v.paused ? v.play() : v.pause();
        });
      }
      bind(document.getElementById('v'));

      (function tick() {
        document.getElementById('clock').textContent = fmt(video.currentTime);
        requestAnimationFrame(tick);
      })();

      document.getElementById('play').onclick = () => (video.paused ? video.play() : video.pause());
      document.getElementById('seek').oninput = (e) => (video.currentTime = Number(e.target.value));
      document.getElementById('fs').onclick = () =>
        document.fullscreenElement ? document.exitFullscreen() : player.requestFullscreen();

      // A site-level Space handler in the bubble phase, like many players have.
      document.addEventListener('keydown', (e) => {
        if (!document.getElementById('siteKeys').checked) return;
        if (e.code === 'Space') {
          e.preventDefault();
          window.siteToggles++;
          log('site: Space → toggle');
          video.paused ? video.play() : video.pause();
        }
      });

      // Like a player that fetches segmented captions and a TTML file by script (FR-S8).
      // Fullscreen on the bare <video>, like a native-controls double-click (FR-V10).
      document.getElementById('fs-video').onclick = () =>
        document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen();

      // FR-V9: blob: sources, and an episode switch that keeps the same element.
      if (params.get('blob')) {
        const toBlob = (u) =>
          fetch(u)
            .then((r) => r.blob())
            .then((b) => URL.createObjectURL(b));
        toBlob('media/tone.wav').then((u) => (video.src = u));
        const next = document.getElementById('next-blob');
        next.hidden = false;
        next.onclick = () =>
          toBlob('media/long.wav').then((u) => {
            video.src = u;
            log('site: same <video>, new blob source');
          });
      }

      // FR-V9: SPA navigation that changes the URL but keeps the <video> and its source.
      if (params.get('pushstate')) {
        const next = document.getElementById('next-url');
        next.hidden = false;
        next.onclick = () => {
          history.pushState({}, '', 'player-episode-4.html?pushstate=1');
          log('site: URL changed, same <video>');
        };
      }

      if (params.get('sniff')) {
        Promise.all(
          ['subs/hls/seg-1.vtt', 'subs/hls/seg-2.vtt', 'subs/extra.ttml'].map((u) =>
            fetch(u).then((r) => r.text()),
          ),
        ).then((parts) => {
          window.sniffLoaded = parts.length;
          log(`site: fetched ${parts.length} subtitle files`);
        });
      }

      if (params.get('spa')) {
        const next = document.getElementById('next');
        next.hidden = false;
        let ep = 3;
        next.onclick = () => {
          ep++;
          const fresh = document.createElement('video');
          fresh.id = 'v';
          fresh.preload = 'auto';
          video.replaceWith(fresh);
          bind(fresh);
          document.title = `Maple Street S01E0${ep} – Fixture Player`;
          history.pushState({}, '', `?spa=1&ep=${ep}`);
          log(`site: swapped <video> for episode ${ep}`);
        };
      }
    </script>
  </body>
</html>
